name: Stock engine regression checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all stock engine regression tests
        run: node --test tests/*.test.cjs
# Production deploy is managed independently by Cloudflare Workers Builds
# via the existing GitHub main-branch integration. No GitHub deploy secrets needed.
